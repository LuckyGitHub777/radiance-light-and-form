name: Verify Radiance Light Room
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radiance-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source integrity and offline tests
        run: python -m unittest discover -s tests -v
      - name: Exercise Light Room controls without runtime dependencies
        run: node tests/browser-smoke.cjs
