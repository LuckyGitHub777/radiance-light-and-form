<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Radiance Light Room: original ambient luminous geometry for a quiet, private, offline visual experience.">
<title>Radiance — Light Room</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-LmaFaUycakXzMxSez7B9BkQ8b/4q2yY3p40i7Q74Nu4='; script-src 'sha256-e8xSJ+hLCuAFH+qkZhppFxnPhvbl7Fd+spG+fQGjvGM='; img-src data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{--hue-a:#f2cd91;--hue-b:#84d6d2;--hue-c:#d5a76b;--vignette:#070b13;--text:#f4f0e8;--muted:#b6c2cb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#080d17;color:var(--text);font-family:Segoe UI,Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button,a{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #f6d79b;outline-offset:4px}
button:disabled{opacity:.5;cursor:default}
button,input{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.room{min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 80% 90% at 51% 52%,#13283c 0%,#0b1725 47%,#060a12 85%),#080d17}
.room:after{content:"";pointer-events:none;position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse 67% 67% at 50% 49%,transparent 49%,#03070fb5 100%)}
.light{position:absolute;inset:0;z-index:0;pointer-events:none;transition:opacity .25s;opacity:.72}
.light .a,.light .b,.light .c,.light .d{position:absolute;display:block;opacity:.44;filter:blur(32px);width:50%;height:70%}
.light .a{top:-19%;left:-16%;background:radial-gradient(ellipse,var(--hue-a),transparent 69%)}
.light .b{top:-21%;right:-18%;background:radial-gradient(ellipse,var(--hue-b),transparent 69%)}
.light .c{bottom:-32%;left:-17%;background:radial-gradient(ellipse,var(--hue-b),transparent 72%)}
.light .d{bottom:-32%;right:-17%;background:radial-gradient(ellipse,var(--hue-a),transparent 72%)}
.light .center{position:absolute;display:block;width:70%;height:80%;left:15%;top:8%;background:radial-gradient(ellipse at 50% 48%,var(--hue-a) 0%,var(--hue-b) 26%,transparent 65%);opacity:.22;filter:blur(55px)}
.room.power-soft .light{opacity:.28}.room.power-balanced .light{opacity:.58}.room.power-radiant .light{opacity:.84}
.room.power-soft .art{opacity:.65}.room.power-balanced .art{opacity:.85}.room.power-radiant .art{opacity:1}
.shell{position:relative;z-index:4;min-height:100vh;min-height:100dvh;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;padding:24px 38px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:56px}
.brand{display:flex;align-items:center;gap:15px;line-height:1.25}
.monogram{display:grid;place-items:center;border-radius:50%;width:42px;height:42px;border:1px solid #ebcf9d77;background:radial-gradient(circle,#d9b67655,transparent 70%);box-shadow:0 0 20px #b4a66a24;color:var(--hue-a);font-size:23px}
.brand strong{display:block;letter-spacing:.24em;font-size:12px;font-weight:700}
.brand small{display:block;color:#c6cfd5;letter-spacing:.13em;font-size:10px;margin-top:3px}
.top-actions{display:flex;align-items:center;gap:10px}
.link{color:#bacbd8;text-decoration:none;font-size:12px;letter-spacing:.04em;padding:8px 5px}.link:hover{color:#fff;text-decoration:underline}
.copy{position:relative;z-index:4;text-align:center;margin:22px auto 0;max-width:630px}
h1{font-size:clamp(29px,4.25vw,61px);font-weight:300;letter-spacing:-.035em;line-height:1.1;margin:5px 0 9px}
.subtitle{font-size:13px;color:#b9c8d0;letter-spacing:.02em;margin:0}
.canvas{flex:1;position:relative;display:grid;place-items:center;min-height:340px;z-index:3}
.canvas:before{content:"";position:absolute;inset:11% 18%;border-radius:50%;border:1px solid #a4d2cc0c;box-shadow:0 0 130px #bba16c08;pointer-events:none}
.art{width:min(75vw,650px);height:min(58vh,510px);max-height:540px;display:block;overflow:visible;filter:drop-shadow(0 0 13px #e3c68d6b) drop-shadow(0 0 42px #5ec8c530);transition:opacity .25s;}
.art .scene{display:none}.art .scene.active{display:inline}
.art .outline{fill:none;stroke:var(--hue-a);stroke-width:1.3;opacity:.86}
.art .secondary{stroke:var(--hue-b);opacity:.7}
.art .fill-a{fill:var(--hue-a);fill-opacity:.10;stroke:var(--hue-a);stroke-opacity:.88;stroke-width:1.2}
.art .fill-b{fill:var(--hue-b);fill-opacity:.11;stroke:var(--hue-b);stroke-opacity:.72;stroke-width:1.2}
.art .fine{stroke-width:.6;opacity:.44}
.art .beacon{fill:var(--hue-a);opacity:.9;filter:drop-shadow(0 0 11px var(--hue-a))}
.art .ring{fill:none;stroke:var(--hue-a);stroke-width:.75;opacity:.40}
.art .dust{fill:var(--hue-b);opacity:.7}
.art .slow-ring{transform-origin:360px 260px}
.room.moving .slow-ring{animation:turn 240s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.dock{position:relative;z-index:5;max-width:1110px;width:100%;margin:0 auto 3px;border:1px solid #68839564;border-radius:19px;box-shadow:0 18px 80px #00000038, inset 0 1px #ffffff09;background:linear-gradient(120deg,#142537e8,#0f1c2de8);padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.group-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#b5c3cc;margin-right:6px}
.choice,.command{border:1px solid #57728370;background:#132739;color:#dce6e9;border-radius:9px;font-size:12px;min-height:38px;padding:9px 13px}
.choice:hover,.command:hover{border-color:#b8d5ce9a;background:#1d3a48}
.choice[aria-pressed="true"]{color:#181a1b;background:linear-gradient(145deg,#f5dca8,var(--hue-a));border-color:#ebcf9d;box-shadow:0 0 15px #ebcb8b22}
.command.primary{background:#e2c28c;color:#13212d;border-color:#dfd1ae;font-weight:650}
.dock-bottom{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #a0c2cf17;padding-top:12px}
.note{font-size:11px;color:#a8b8c4;letter-spacing:.015em}.note strong{font-weight:550;color:#bde8d8}
.help{font-size:11px;color:#b5c0c9;max-width:700px;margin:12px auto 0;text-align:center;line-height:1.5}
.help a{color:#e1ccab}
.minimize{display:none;position:fixed;z-index:10;right:21px;bottom:22px;min-height:42px;background:#122335dd;color:#d5e4e7;border:1px solid #708f99;border-radius:99px;padding:10px 17px;font-size:12px;box-shadow:0 5px 24px #0005}
.room.quiet-mode .top,.room.quiet-mode .copy,.room.quiet-mode .dock,.room.quiet-mode .help{display:none}
.room.quiet-mode .minimize{display:block;opacity:.72}.room.quiet-mode .minimize:hover,.room.quiet-mode .minimize:focus-visible{opacity:1}
.room.quiet-mode .canvas{min-height:100vh;min-height:100dvh}
.room.quiet-mode .shell{padding:0}
.room.quiet-mode .art{height:min(76vh,620px);width:min(85vw,820px)}
.room.quiet-mode .room-note{display:none}
.room.full-visual .shell{max-width:none}
@media(max-width:850px){.shell{padding:18px}.copy{margin-top:12px}.canvas{min-height:320px}.art{width:min(92vw,620px);height:min(43vh,450px)}.dock{justify-content:center}.dock-bottom{justify-content:center;flex-wrap:wrap}}
@media(max-width:520px){.shell{padding:16px 12px 20px}.top{gap:8px}.brand{gap:8px}.monogram{width:34px;height:34px}.brand strong{font-size:10px}.brand small{font-size:8px}.copy{margin-top:18px}.subtitle{font-size:12px}.canvas{min-height:255px}.art{width:min(94vw,520px);height:min(39vh,335px)}.dock{padding:12px;gap:10px}.group{justify-content:center}.group-label{width:100%;text-align:center;margin:0}.choice{font-size:11px;min-height:36px;padding:8px 9px}.command{font-size:11px}.help{font-size:10px;margin:8px auto 0}.dock-bottom{padding-top:9px}.note{display:none}.room.quiet-mode .art{width:95vw;height:74vh}}
@media(max-height:660px) and (min-width:651px){.shell{padding-top:14px;padding-bottom:13px}.copy{margin-top:0}.canvas{min-height:210px}.art{height:min(49vh,400px)}.dock{padding:10px 15px}.help{margin-top:6px}}
@media(prefers-reduced-motion:reduce){.room.moving .slow-ring{animation:none!important}*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* Optional original light flow: no flash cuts, default remains still for accessibility and older computers. */
.room.moving .slow-ring{animation:turn 75s linear infinite}
.room.moving .light .center{animation:ambient-breathe 9s ease-in-out infinite alternate}
.room.moving .light .a{animation:aurora-west 22s ease-in-out infinite alternate}
.room.moving .light .b{animation:aurora-east 26s ease-in-out infinite alternate}
.room.moving .art .beacon{animation:beacon-breathe 8s ease-in-out infinite alternate}
.room.moving .art .scene.active .outline{animation:line-shimmer 13s ease-in-out infinite alternate}
.room.moving .art .scene.active .fill-a{animation:facet-glow 7s ease-in-out infinite alternate}
.room.moving .art .scene.active .fill-b{animation:facet-glow 9s ease-in-out infinite alternate-reverse}
@keyframes ambient-breathe{from{opacity:.20;transform:scale(.94)}to{opacity:.43;transform:scale(1.09)}}
@keyframes aurora-west{from{opacity:.34;transform:translate3d(-4%,2%,0)}to{opacity:.61;transform:translate3d(10%,-4%,0)}}
@keyframes aurora-east{from{opacity:.32;transform:translate3d(5%,-3%,0)}to{opacity:.60;transform:translate3d(-9%,4%,0)}}
@keyframes beacon-breathe{from{opacity:.65}to{opacity:1}}
@keyframes line-shimmer{from{opacity:.65}to{opacity:.98}}
@keyframes facet-glow{from{fill-opacity:.07}to{fill-opacity:.27}}
@media(prefers-reduced-motion:reduce){.room.moving *{animation:none!important}}

/* Original Radiance Motion Study: continuous kinetic light; never flashes. */
.light-stream{opacity:.13;transition:opacity .6s ease;pointer-events:none}
.light-stream .stripe-a{stroke:var(--hue-a)}
.light-stream .stripe-b{stroke:var(--hue-b)}
.room.moving .light-stream{opacity:.74}
.room.moving .stream-left .stream-tracks{animation:surface-down 10s linear infinite}
.room.moving .stream-right .stream-tracks{animation:surface-up 13s linear infinite}
.room.moving .stream-prism .stream-tracks{animation:surface-down 9s linear infinite}
.room.moving .halo-flow{animation:orbit-art 24s linear infinite;transform-origin:360px 270px}
.room.moving .bloom-flow{animation:orbit-art-back 36s linear infinite;transform-origin:360px 270px}
.halo-flow,.bloom-flow{opacity:.24}
.room.moving .halo-flow,.room.moving .bloom-flow{opacity:.6}
@keyframes surface-down{to{transform:translateY(56px)}}
@keyframes surface-up{to{transform:translateY(-56px)}}
@keyframes orbit-art{to{transform:rotate(360deg)}}
@keyframes orbit-art-back{to{transform:rotate(-360deg)}}
/* Paces alter motion visibly without introducing jarring jumps. */
.room.speed-drift.moving .stream-left .stream-tracks{animation-duration:20s}
.room.speed-drift.moving .stream-right .stream-tracks{animation-duration:26s}
.room.speed-drift.moving .stream-prism .stream-tracks{animation-duration:18s}
.room.speed-drift.moving .halo-flow{animation-duration:44s}
.room.speed-drift.moving .bloom-flow{animation-duration:60s}
.room.speed-vivid.moving .stream-left .stream-tracks{animation-duration:6s}
.room.speed-vivid.moving .stream-right .stream-tracks{animation-duration:8s}
.room.speed-vivid.moving .stream-prism .stream-tracks{animation-duration:6s}
.room.speed-vivid.moving .halo-flow{animation-duration:17s}
.room.speed-vivid.moving .bloom-flow{animation-duration:23s}
@media(prefers-reduced-motion:reduce){.room.moving .stream-tracks,.room.moving .halo-flow,.room.moving .bloom-flow{animation:none!important}}
/* Immersive environment: larger geometry with low-contrast peripheral light. */
.ambient-curtain{display:none;position:absolute;inset:0 auto 0 0;width:31%;height:100%;z-index:1;pointer-events:none;opacity:.19;filter:blur(9px);-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 18%,#000 64%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 18%,#000 64%,transparent 100%);background:
  radial-gradient(ellipse 90% 66% at 80% 50%,var(--hue-b),transparent 77%),
  repeating-linear-gradient(180deg,transparent 0 21px,var(--hue-a) 22px 23px,transparent 25px 48px)}
.ambient-curtain.right{left:auto;right:0;transform:scaleX(-1);background:
  radial-gradient(ellipse 90% 66% at 80% 50%,var(--hue-a),transparent 77%),
  repeating-linear-gradient(180deg,transparent 0 23px,var(--hue-b) 24px 25px,transparent 27px 51px)}
.canvas>.art{position:relative;z-index:2}
.room.quiet-mode .shell{max-width:none}
.room.quiet-mode .canvas{width:100%;min-height:100vh;min-height:100dvh}
.room.quiet-mode .art{width:min(100vw,1600px);height:min(100vh,1040px);max-height:none}
.room.full-visual:not(.quiet-mode) .art{width:min(91vw,1240px);height:min(66vh,740px);max-height:none}
.room:is(.quiet-mode,.full-visual) .ambient-curtain{display:block}
.room.power-soft .ambient-curtain{opacity:.12}
.room.power-balanced .ambient-curtain{opacity:.19}
.room.power-radiant .ambient-curtain{opacity:.28}
/* Moving curtains: transparent, low-contrast, continuous and never strobing. */
.room.moving .ambient-curtain.left{animation:wing-drift 20s ease-in-out infinite alternate}
.room.moving .ambient-curtain.right{animation:wing-drift-right 25s ease-in-out infinite alternate}
.room.speed-drift.moving .ambient-curtain{animation-duration:36s}
.room.speed-vivid.moving .ambient-curtain{animation-duration:14s}
@keyframes wing-drift{from{transform:translateY(-18px)}to{transform:translateY(18px)}}
@keyframes wing-drift-right{from{transform:scaleX(-1) translateY(-18px)}to{transform:scaleX(-1) translateY(18px)}}
@media(max-width:650px){.ambient-curtain{display:none!important}.room.quiet-mode .art{width:100vw;height:min(99vh,760px)}}
@media(prefers-reduced-motion:reduce){.room.moving .ambient-curtain{animation:none!important}}

/* Living field: original continuous multiscale SVG waves, no external resources. */
.living-field{pointer-events:none;opacity:.83}
.room.power-soft .living-field{opacity:.46}
.room.power-radiant .living-field{opacity:.96}

/* Structured signal leads; the existing organic waveform remains available. */
.room.pattern-linear .living-field{opacity:.96}
.room.pattern-linear.power-soft .living-field{opacity:.46}
.room.pattern-linear.power-radiant .living-field{opacity:1}
.room.pattern-linear .living-field path{stroke-linecap:square}
.room.pattern-linear.moving .light-stream{opacity:.19}
.room.pattern-linear:not(.moving) .light-stream{opacity:.12}

/* Surge accelerates translation and orbital travel without strobe or color cuts. */
.room.speed-surge.moving .stream-left .stream-tracks{animation-duration:3.4s}
.room.speed-surge.moving .stream-right .stream-tracks{animation-duration:4.4s}
.room.speed-surge.moving .stream-prism .stream-tracks{animation-duration:3.6s}
.room.speed-surge.moving .halo-flow{animation-duration:10s}
.room.speed-surge.moving .bloom-flow{animation-duration:13s}
.room.speed-surge.moving .slow-ring{animation-duration:38s}
.room.speed-surge.moving .ambient-curtain{animation-duration:11s}
/* Brighter chroma within the existing independent color and glow controls. */
.room.palette-spectrum .living-field{filter:saturate(1.18)}
</style>
</head>

      <div class="group" role="group" aria-label="Choose light palette"><span class="group-label">Color</span><button class="choice" data-color="spectrum" aria-pressed="true">Spectrum</button><button class="choice" data-color="aurum" aria-pressed="false">Amber</button><button class="choice" data-color="aurora" aria-pressed="false">Aurora</button><button class="choice" data-color="ocean" aria-pressed="false">Blue</button><button class="choice" data-color="violet" aria-pressed="false">Violet</button><button class="choice" data-color="rose" aria-pressed="false">Rose</button></div>
      <div class="dock-bottom">
        <div class="group" role="group" aria-label="Choose light pattern"><span class="group-label">Pattern</span><button class="choice" data-pattern="linear" aria-pressed="true">Linear</button><button class="choice" data-pattern="organic" aria-pressed="false">Organic</button></div>
        <div class="group" role="group" aria-label="Light intensity"><span class="group-label">Glow</span><button class="choice" data-power="soft" aria-pressed="false">Soft</button><button class="choice" data-power="balanced" aria-pressed="true">Warm</button><button class="choice" data-power="radiant" aria-pressed="false">Radiant</button></div>
        <div class="group" role="group" aria-label="Light movement speed"><span class="group-label">Flow pace</span><button class="choice" data-speed="drift" aria-pressed="false">Drift</button><button class="choice" data-speed="flow" aria-pressed="true">Flow</button><button class="choice" data-speed="vivid" aria-pressed="false">Vivid</button><button class="choice" data-speed="surge" aria-pressed="false" title="Fast traveling patterns without intentional flashing">Surge</button></div>
        <div class="group"><button class="command" id="motion" aria-pressed="true">Pause light flow</button><button class="command" id="hide-ui">Hide controls</button><button class="command primary" id="fullscreen">Fullscreen</button></div>

</div>
<script>
(function(){'use strict';
  var room=document.getElementById('room');
  var colorSets={spectrum:['#f2bb63','#6ddafd'],aurum:['#f2cd91','#84d6d2'],aurora:['#9eeac3','#91cee5'],ocean:['#9ecbfa','#7fdfe6'],violet:['#cfb8f7','#9dcae7'],rose:['#f0b6ca','#e5c18f']};
  var scene='pyramid',color='spectrum',power='balanced',motion=true,speed='flow',pattern='linear';
  var reduce=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;

  /* Local procedural light. Paths evolve independently inside each geometry,
     are throttled for low-power devices, and stop for Pause/reduced motion/hidden tabs. */
  var fieldGroups={'pyramid':['pyramid-left','pyramid-right'],halo:['halo'],bloom:['bloom'],prism:['prism']};
  var fieldColors={
    spectrum:['#23dcff','#567aff','#cd56fa','#ff4fa6','#fec157','#43e5a5','#ff745d'],
    aurum:['#f2cd91','#84d6d2','#aab8f7','#e9adcf','#b5e9e2'],
    aurora:['#9eeac3','#91cee5','#b1acfa','#f0bfd6','#e0f9ce'],
    ocean:['#9ecbfa','#7fdfe6','#a6aaf9','#c1eeff','#d6b7ee'],
    violet:['#cfb8f7','#9dcae7','#edb6dc','#9cb8fa','#ead6aa'],
    rose:['#f0b6ca','#e5c18f','#b9a5e8','#ffdbbd','#9fcedb']
  };
  var fieldPaths={},fieldReady=false,fieldFrame=0,fieldLast=0,fieldTime=0;
  function initField(){
    if(fieldReady)return;
    var names=['pyramid-left','pyramid-right','halo','bloom','prism'];
    for(var k=0;k<names.length;k++){
      var root=document.getElementById('field-'+names[k]);fieldPaths[names[k]]=[];
      if(!root)continue;
      for(var i=0;i<52;i++){
        var p=document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');
        p.setAttribute('stroke-width',String(1.15+(i%5)*0.38));
        p.setAttribute('opacity',String(.30+(i%7)*.065));
        root.appendChild(p);fieldPaths[names[k]].push(p);
      }
    }
    fieldReady=true;
  }
  function drawField(){
    if(!fieldReady)return;
    var names=fieldGroups[scene],colors=fieldColors[color]||fieldColors.aurum;
    for(var k=0;k<names.length;k++){
      var paths=fieldPaths[names[k]],reverse=(names[k]==='pyramid-right'||scene==='bloom')?-1:1;
      for(var i=0;i<paths.length;i++){
        var offset=i*13.2+fieldTime*(pattern==='linear'?6.1:7.8)*reverse+k*9;
        var base=((offset%690)+690)%690-92;
        var d='',x,y;
        if(pattern==='linear'){
          /* Independent horizontal fragments with compact glyph-like accents.
             Continuously moving geometry without rapid high-contrast flashes. */
          for(var j=0;j<23;j++){
            var seed=(i*73+j*47+k*29)%113;
            if(seed%9===0||seed%13===0)continue;
            x=122+j*20+(seed%5)+2.3*Math.sin(fieldTime*.30+i*.42+j*.31);
            y=base+(seed%4===0?1.8:0);
            var length=2.4+(seed%15);
            d+='M'+x.toFixed(1)+' '+y.toFixed(1)+'h'+length.toFixed(1)+' ';
            if(seed%7===0)d+='M'+(x+length*.5).toFixed(1)+' '+(y-1.5).toFixed(1)+'v3 ';
          }
          paths[i].setAttribute('stroke-width',String(1.6+(i%5)*.43));
          paths[i].setAttribute('opacity',String(.39+(i%7)*.07));
        }else{
          for(x=116;x<=610;x+=19){
            y=base+9.5*Math.sin(x*.028+fieldTime*.82*reverse+i*.38)+
              4.8*Math.sin(x*.066-fieldTime*.56+i*.22+k*1.6);
            d+=(x===116?'M':'L')+x+' '+y.toFixed(1)+' ';
          }
          paths[i].setAttribute('stroke-width',String(1.15+(i%5)*.38));
          paths[i].setAttribute('opacity',String(.30+(i%7)*.065));
        }
        paths[i].setAttribute('d',d);
        paths[i].setAttribute('stroke',colors[(i+2*k)%colors.length]);
      }
    }
  }
  function fieldTick(now){
    fieldFrame=0;
    var allowed=motion&&!(reduce&&reduce.matches)&&!document.hidden;
    if(!allowed)return;
    var minMs=speed==='drift'?155:speed==='surge'?65:speed==='vivid'?75:105;
    if(!fieldLast||now-fieldLast>=minMs){
      var delta=fieldLast?Math.min((now-fieldLast)/1000,.2):.1;
      fieldTime+=delta*(speed==='drift'?.54:speed==='surge'?3.05:speed==='vivid'?1.65:1);
      fieldLast=now;drawField();
    }
    if(window.requestAnimationFrame)fieldFrame=window.requestAnimationFrame(fieldTick);
  }
  function syncField(allowed){
    initField();drawField();
    if(!allowed){
      if(fieldFrame&&window.cancelAnimationFrame)window.cancelAnimationFrame(fieldFrame);
      fieldFrame=0;fieldLast=0;return;
    }
    if(!fieldFrame&&window.requestAnimationFrame){
      fieldLast=0;fieldFrame=window.requestAnimationFrame(fieldTick);
    }
  }
  function mark(name,value){var buttons=document.querySelectorAll('[data-'+name+']');for(var i=0;i<buttons.length;i++)buttons[i].setAttribute('aria-pressed',buttons[i].getAttribute('data-'+name)===value?'true':'false');}
  function pickScene(value){if(['pyramid','halo','bloom','prism'].indexOf(value)<0)return;scene=value;var list=['pyramid','halo','bloom','prism'];for(var i=0;i<list.length;i++){var el=document.getElementById('scene-'+list[i]);el.setAttribute('class',list[i]===value?'scene active':'scene');}mark('scene',value);drawField();}
  function pickColor(value){if(!colorSets[value])return;color=value;room.style.setProperty('--hue-a',colorSets[value][0]);room.style.setProperty('--hue-b',colorSets[value][1]);room.classList.toggle('palette-spectrum',value==='spectrum');mark('color',value);drawField();}
  function pickPower(value){if(['soft','balanced','radiant'].indexOf(value)<0)return;room.classList.remove('power-soft','power-balanced','power-radiant');room.classList.add('power-'+value);power=value;mark('power',value);}
  function updateMotion(){var allowed=motion&&!(reduce&&reduce.matches)&&!document.hidden;room.classList.toggle('moving',allowed);var btn=document.getElementById('motion');btn.setAttribute('aria-pressed',motion?'true':'false');btn.textContent=allowed?'Pause light flow':motion?'Motion unavailable · still':'Start light flow';syncField(allowed);}
  function quiet(on){room.classList.toggle('quiet-mode',!!on);if(on)document.getElementById('restore-ui').focus();else document.getElementById('hide-ui').focus();}
  room.classList.add('pattern-linear');
  var patternButtons=document.querySelectorAll('[data-pattern]');
  for(var pi=0;pi<patternButtons.length;pi++)patternButtons[pi].addEventListener('click',function(){
    var value=this.getAttribute('data-pattern');if(value!=='linear'&&value!=='organic')return;
    pattern=value;room.classList.remove('pattern-linear','pattern-organic');
    room.classList.add('pattern-'+value);mark('pattern',value);drawField();
  });
  var speedButtons=document.querySelectorAll('[data-speed]');
  for(var si=0;si<speedButtons.length;si++)speedButtons[si].addEventListener('click',function(){
    var value=this.getAttribute('data-speed');if(['drift','flow','vivid','surge'].indexOf(value)<0)return;
    room.classList.remove('speed-drift','speed-flow','speed-vivid','speed-surge');room.classList.add('speed-'+value);
    speed=value;mark('speed',value);
  });
  room.classList.add('speed-flow');
  var btns=document.querySelectorAll('[data-scene],[data-color],[data-power]');for(var i=0;i<btns.length;i++)btns[i].addEventListener('click',function(){var a=this.getAttribute('data-scene'),b=this.getAttribute('data-color'),c=this.getAttribute('data-power');if(a)pickScene(a);if(b)pickColor(b);if(c)pickPower(c);});
  document.getElementById('motion').addEventListener('click',function(){motion=!motion;updateMotion();});
  document.getElementById('hide-ui').addEventListener('click',function(){quiet(true);});
  document.getElementById('restore-ui').addEventListener('click',function(){quiet(false);});
  var fullBtn=document.getElementById('fullscreen');
  if(!(room.requestFullscreen||room.webkitRequestFullscreen||room.mozRequestFullScreen)){
    fullBtn.disabled=true;
    fullBtn.title='Fullscreen is not supported in this browser';
  }
  function syncFull(){var on=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);room.classList.toggle('full-visual',on);fullBtn.textContent=on?'Exit fullscreen':'Fullscreen';}
  fullBtn.addEventListener('click',function(){var doc=document,active=doc.fullscreenElement||doc.webkitFullscreenElement||doc.mozFullScreenElement;if(active){var exit=doc.exitFullscreen||doc.webkitExitFullscreen||doc.mozCancelFullScreen;if(exit)try{exit.call(doc);}catch(e){}}else{var el=room,enter=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(enter)try{var result=enter.call(el);if(result&&result.catch)result.catch(function(){fullBtn.textContent='Fullscreen unavailable';});}catch(e){fullBtn.textContent='Fullscreen unavailable';}}});
  document.addEventListener('fullscreenchange',syncFull);document.addEventListener('webkitfullscreenchange',syncFull);document.addEventListener('mozfullscreenchange',syncFull);
  document.addEventListener('visibilitychange',updateMotion);
  if(reduce){if(reduce.addEventListener)reduce.addEventListener('change',updateMotion);else if(reduce.addListener)reduce.addListener(updateMotion);}
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&room.classList.contains('quiet-mode'))quiet(false);});
  if(window.location.protocol==='file:')document.getElementById('back-studio').hidden=true;
  pickScene(scene);pickColor(color);pickPower(power);updateMotion();
})();
</script>
